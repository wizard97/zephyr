tests:
  kernel.poll.smp:
    ignore_faults: true
    tags:
      - kernel
      - smp
      - userspace
    filter: CONFIG_MP_MAX_NUM_CPUS > 1
    extra_configs:
      - CONFIG_MP_MAX_NUM_CPUS=2
      - CONFIG_SMP=y
      - CONFIG_SCHED_CPU_MASK=y
    integration_platforms:
      - qemu_cortex_a53/qemu_cortex_a53/smp
      - qemu_riscv64/qemu_virt_riscv64/smp
  kernel.poll:
    ignore_faults: true
    tags:
      - kernel
      - userspace
    platform_exclude:
      - nrf52dk/nrf52810
  kernel.poll.minimallibc:
    filter: CONFIG_MINIMAL_LIBC_SUPPORTED
    ignore_faults: true
    tags:
      - kernel
      - userspace
      - libc
    platform_exclude:
      - nrf52dk/nrf52810
    extra_configs:
      - CONFIG_MINIMAL_LIBC=y
