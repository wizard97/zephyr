tests:
  libraries.data_structures:
    tags: notify
    integration_platforms:
      - native_sim
  libraries.notify.smp:
    tags:
      - notify
      - smp
    filter: CONFIG_MP_MAX_NUM_CPUS > 1
    extra_configs:
      - CONFIG_SMP=y
      - CONFIG_SCHED_CPU_MASK=y
    integration_platforms:
      - qemu_cortex_a53/qemu_cortex_a53/smp
      - qemu_riscv64/qemu_virt_riscv64/smp
